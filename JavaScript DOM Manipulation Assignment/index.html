<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation Assignment</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <!-- Task 1: Change Text and Style Setup -->
    <section>
        <h1 id="mainHeading">Hello</h1>
        <p id="para">This is a paragraph.</p>
    </section>

    <!-- Task 2: Replace Text with Bold HTML Setup -->
    <section>
        <p id="info">This is a normal text.</p>
    </section>

    <!-- Task 3: Style Multiple Elements Setup -->
    <section>
        <p class="note">Note 1</p>
        <p class="note">Note 2</p>
    </section>

    <!-- Task 4: Add a New Paragraph Setup -->
    <section>
        <div id="container">
            <p>This is the original paragraph.</p>
        </div>
    </section>

    <!-- Task 5: Change Image Source Setup -->
    <section>
        <img src="images/image1.jpg" alt="Description of the image">
    </section>

    <!-- Section 2 Setup -->
    <section>
        <h1 id="main-heading">Welcome to DOM</h1>
        <p class="description">Learning DOM is fun!</p>
        <button>Click me</button>
        <button>Don't click me</button>
        <div><span style="display:none">This is a span inside a div</span></div>
    </section>


    <script src="script.js"></script>
</body>
</html>
